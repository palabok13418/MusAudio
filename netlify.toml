[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

 [build.environment]
   NODE_VERSION = "22"

[[redirects]]
  from = "/amp"
  to = "/.netlify/functions/amp"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/engine"
  to = "/.netlify/functions/engine"
  status = 200

[[redirects]]
  from = "/decode"
  to = "/.netlify/functions/decode"
  status = 200

[[redirects]]
  from = "/probe"
  to = "/.netlify/functions/probe"
  status = 200

[[redirects]]
  from = "/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pro"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/musaumz"
  to = "/index.html"
  status = 200
